<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>💰 Personal Expense Tracker</h1>
        <p>Manage and track your daily expenses</p>
    </header>


    <main>

        <!-- Summary -->

        <section class="summary">

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Number of Expenses</h3>
                <p id="expenseCount">0</p>
            </div>

        </section>


        <!-- Add Expense -->

        <section class="form-section">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <div class="form-group">

                    <label for="expenseTitle">
                        Expense Title
                    </label>

                    <input
                        type="text"
                        id="expenseTitle"
                        placeholder="Example: Lunch"
                        required>

                </div>


                <div class="form-group">

                    <label for="expenseAmount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Example: 250"
                        min="1"
                        required>

                </div>


                <div class="form-group">

                    <label for="expenseCategory">
                        Category
                    </label>

                    <select id="expenseCategory" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="expenseDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="expenseDate"
                        required>

                </div>


                <button type="submit" id="submitBtn">
                    Add Expense
                </button>

            </form>

        </section>


        <!-- Search -->

        <section class="search-section">

            <h2>My Expenses</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search expenses...">

        </section>


        <!-- Expense Table -->

        <section class="table-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="expenseTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 M R SATHISH | Expense Tracker
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
